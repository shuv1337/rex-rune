name: Binary release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Manifest and throwaway-key signing tests
        run: python3 scripts/test-release.py

  install-script:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - 'archlinux:base@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899'
          - 'ubuntu:24.04@sha256:fe81560990fae86dc4743202b2cb4d3df98d0bcf949173cecef15ce1127ef852'
          - 'debian:trixie@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6'
          - 'fedora:latest@sha256:a7d72ba2745b100a3351087472e5ee7b2450af7cf331e7673007e3817612839c'
          - 'ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11'
          - 'debian:12@sha256:268fb24c39bca92d326dd83ea3abebe4a3f7751c804ffef23bb6d857dd343ff8'
          - 'alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Installer fixtures, real v0.5.1 assets, and tamper tests
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: bash scripts/install-script-test.sh "$TEST_IMAGE"

  build:
    env:
      REX_RUNE_CHANNEL: official
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Native build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config dpkg-dev desktop-file-utils libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Formatting, lint, and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
          cargo test --manifest-path vendor/rexrs/Cargo.toml --all-features
      - name: Build
        run: cargo build --locked --release --bin rex-rune
      - name: Package
        run: |
          python3 scripts/package-release.py --deb
          desktop-file-validate resources/dev.shuv.rex-rune.desktop
          # The second tarball is for the updater inside 0.7.x clients, which knows the client
          # as rex-linux: check it against that updater's rules.
          python3 scripts/test-bridge.py dist/rex-linux-*.tar.gz --binary target/release/rex-rune
      - name: Test packaged install without touching the runner's real home
        run: |
          mkdir -p "$RUNNER_TEMP/package-test"
          tar -xzf dist/rex-rune-*.tar.gz -C "$RUNNER_TEMP/package-test"
          package=$(find "$RUNNER_TEMP/package-test" -mindepth 1 -maxdepth 1 -type d)
          export HOME="$RUNNER_TEMP/install-test"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_BIN_HOME="$HOME/.local/bin"
          mkdir -p "$HOME"
          bash "$package/install.sh"
          cmp target/release/rex-rune "$XDG_BIN_HOME/rex-rune"
          "$XDG_BIN_HOME/rex-rune" --version
          desktop-file-validate "$XDG_DATA_HOME/applications/dev.shuv.rex-rune.desktop"
          python3 -c 'import hashlib,json,os,pathlib; p=pathlib.Path(os.environ["XDG_BIN_HOME"])/"rex-rune"; r=json.load(open(pathlib.Path(os.environ["XDG_DATA_HOME"])/"rex-rune/install.json")); assert r["path"] == str(p.resolve()) and r["sha256"] == hashlib.sha256(p.read_bytes()).hexdigest()'
          bash "$package/scripts/install-desktop.sh" --uninstall
          test ! -e "$XDG_BIN_HOME/rex-rune"
          test ! -e "$XDG_DATA_HOME/rex-rune/install.json"
      - name: Take over real rex-linux 0.7.5 installs (tarball and .deb), in a temporary home
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          old="$RUNNER_TEMP/rex-linux-0.7.5"
          mkdir -p "$old"
          deb_arch=$(dpkg --print-architecture)
          for name in "rex-linux-0.7.5-$ARCH-linux-gnu.tar.gz" "rex-linux_0.7.5_$deb_arch.deb"; do
            curl --proto '=https' --tlsv1.2 -fsSLo "$old/$name" "https://github.com/shuv1337/rex-rune/releases/download/v0.7.5/$name"
          done
          tar -xzf "$old/rex-linux-0.7.5-$ARCH-linux-gnu.tar.gz" -C "$old"
          export HOME="$RUNNER_TEMP/takeover-test"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_BIN_HOME="$HOME/.local/bin"
          mkdir -p "$HOME"
          bash "$old/rex-linux-0.7.5-$ARCH-linux-gnu/install.sh"
          test "$("$XDG_BIN_HOME/rex-linux" --version)" = 'rex-linux 0.7.5'
          test -e "$XDG_DATA_HOME/rex-linux/install.json"
          package=$(find "$RUNNER_TEMP/package-test" -mindepth 1 -maxdepth 1 -type d)
          bash "$package/install.sh"
          cmp target/release/rex-rune "$XDG_BIN_HOME/rex-rune"
          test "$(readlink "$XDG_BIN_HOME/rex-linux")" = rex-rune
          # Started by its old name it answers by it, which is what the 0.7.x updater checks.
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$("$XDG_BIN_HOME/rex-linux" --version)" = "rex-linux $version"
          test "$("$XDG_BIN_HOME/rex-rune" --version)" = "rex-rune $version"
          test "$(find "$XDG_DATA_HOME/applications" -name '*.desktop' | wc -l)" = 1
          desktop-file-validate "$XDG_DATA_HOME/applications/dev.shuv.rex-rune.desktop"
          test -z "$(find "$XDG_DATA_HOME" -name '*rex-linux*')"
          test "$(find "$XDG_DATA_HOME/icons" -name 'dev.shuv.rex-rune.png' | wc -l)" = 3
          bash "$package/scripts/install-desktop.sh" --uninstall
          test ! -e "$XDG_BIN_HOME/rex-rune" && test ! -L "$XDG_BIN_HOME/rex-linux"
          # apt replaces the old package with the renamed one in a single transaction.
          sudo apt-get install -y "$old/rex-linux_0.7.5_$deb_arch.deb"
          test "$(/usr/bin/rex-linux --version)" = 'rex-linux 0.7.5'
          dpkg-deb --info dist/*.deb
          sudo apt-get install -y ./dist/*.deb
          test "$(dpkg-query -W -f='${db:Status-Abbrev}' rex-rune)" = 'ii '
          if dpkg-query -W -f='${db:Status-Abbrev}' rex-linux 2>/dev/null | grep -q '^i'; then echo 'rex-linux is still installed'; exit 1; fi
          test "$(/usr/bin/rex-rune --version)" = "rex-rune $version"
          test "$(readlink /usr/bin/rex-linux)" = rex-rune
          test "$(/usr/bin/rex-linux --version)" = "rex-linux $version"
          grep -qx channel=deb /usr/share/rex-rune/channel
          test ! -e /usr/share/applications/dev.shuv.rex-linux.desktop
          test -e /usr/share/applications/dev.shuv.rex-rune.desktop
          test ! -e /usr/share/rex-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  arch-package:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Real makepkg for both architectures (no signing secrets)
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python3 scripts/package-arch.py --version "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-pacman
          path: dist/*.pkg.tar.zst
          if-no-files-found: error

  arch-tests:
    uses: ./.github/workflows/arch-test.yml

  attest:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, arch-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Stage reviewed installer
        run: cp packaging/install/install.sh dist/install.sh
      - name: Attest release packages and installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/install.sh
            dist/*.pkg.tar.zst

  manual-signing-test:
    if: github.event_name == 'workflow_dispatch'
    needs: [build, arch-package, arch-tests, release-tools, install-script]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Generate metadata
        id: metadata
        run: |
          cp packaging/install/install.sh dist/install.sh
          (cd dist && sha256sum -- *.tar.gz *.deb *.pkg.tar.zst > SHA256SUMS)
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          python3 scripts/release-manifest.py --version "$version" --update-from 0.4.2
      - name: Save unsigned metadata before signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-metadata
          path: |
            dist/SHA256SUMS
            dist/latest.json
          if-no-files-found: error
      - name: Sign with a throwaway key
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          umask 077
          trap 'rm -f "$RUNNER_TEMP/release.key" "$RUNNER_TEMP/release.pub" "$RUNNER_TEMP/release-backup.pub"' EXIT
          export RELEASE_MINISIGN_PASSWORD=throwaway-test-password-not-a-secret
          printf '%s\n%s\n' "$RELEASE_MINISIGN_PASSWORD" "$RELEASE_MINISIGN_PASSWORD" |
            minisign -G -p "$RUNNER_TEMP/release.pub" -s "$RUNNER_TEMP/release.key"
          cp "$RUNNER_TEMP/release.pub" "$RUNNER_TEMP/release-backup.pub"
          export RELEASE_MINISIGN_KEY
          RELEASE_MINISIGN_KEY=$(< "$RUNNER_TEMP/release.key")
          python3 scripts/sign-release.py --tag "$RELEASE_TAG" --keys-dir "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/release.pub" "$RUNNER_TEMP/release-backup.pub" dist/
      - name: Save throwaway-signed metadata and test public keys
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-release-metadata
          path: |
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
            dist/latest.json
            dist/latest.json.minisig
            dist/install.sh
            dist/install.sh.minisig
            dist/release.pub
            dist/release-backup.pub
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, arch-package, arch-tests, release-tools, install-script, attest]
    runs-on: ubuntu-24.04
    # Default for plan question 6 (key custody): one reviewed job holds the signing secrets. See docs/releases.md.
    environment: release
    # Shared with repo.yml: two signed site rebuilds must never interleave.
    concurrency:
      group: pkg-repository
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true
      - name: Install minisign
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Checksums and manifest
        id: metadata
        run: |
          cp packaging/install/install.sh dist/install.sh
          (cd dist && sha256sum -- *.tar.gz *.deb *.pkg.tar.zst > SHA256SUMS)
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          # Oldest compatible tarball layout; raise only for an incompatible install change.
          python3 scripts/release-manifest.py --version "$version" --update-from 0.4.2
      - name: Save unsigned metadata before signing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-metadata
          path: |
            dist/SHA256SUMS
            dist/latest.json
          if-no-files-found: error
      - name: Sign and verify metadata
        env:
          RELEASE_MINISIGN_KEY: ${{ secrets.RELEASE_MINISIGN_KEY }}
          RELEASE_MINISIGN_PASSWORD: ${{ secrets.RELEASE_MINISIGN_PASSWORD }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: python3 scripts/sign-release.py --tag "$RELEASE_TAG"
      - name: Sign and verify pacman packages (same release approval)
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: python3 scripts/sign-packages.py
      - name: Save metadata for inspection or draft recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: |
            dist/*.pkg.tar.zst.sig
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
            dist/latest.json
            dist/latest.json.minisig
            dist/install.sh
            dist/install.sh.minisig
          if-no-files-found: error
      - name: Draft, upload, and publish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          version="${GITHUB_REF_NAME#v}"
          # Release notes: this version's CHANGELOG section, then the standing install notes.
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {found=1; next} found && /^## / {exit} found {print}' ../CHANGELOG.md > RELEASE-NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE-NOTES.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat >> RELEASE-NOTES.md <<'EOF'

          ---

          **Coming from Rex Linux?** The client was renamed Rex Rune in this line of releases. **Update now** in Rex Linux 0.7.x installs it, `sudo pacman -Syu` (or `omarchy update`) replaces `rex-linux-bin` with `rex-rune-bin`, and `install.sh` takes over an older install. A `.deb` install is told to download `rex-linux_*.deb`: download **`rex-rune_*.deb`** instead, which replaces `rex-linux`. See [Renamed from Rex Linux](https://github.com/shuv1337/rex-rune#renamed-from-rex-linux).

          **Downloads:** `x86_64` / `amd64` for Intel/AMD; `aarch64` / `arm64` for ARM64.
          - **Debian/Ubuntu:** `sudo apt install ./rex-rune_*.deb` (choose your architecture).
          - **User install/upgrade:** `curl --proto '=https' --tlsv1.2 -fsSL https://github.com/shuv1337/rex-rune/releases/latest/download/install.sh | sh`. Verifies the release before installing; needs `desktop-file-utils` and minisign or OpenSSL 3+.
          - **Manual tarball:** extract the matching `rex-rune-*.tar.gz` and run `bash install.sh` inside it. No root needed; requires `desktop-file-utils`.
          - **`rex-linux-*.tar.gz` is not for installing by hand.** Rex Rune was Rex Linux through 0.7.x; these two archives are this release in the layout the updater inside those clients expects, so **Update now** in 0.7.x still works.
          - `install.sh` has its own detached signature, `install.sh.minisig`, and embeds both release public keys. Pipe-to-shell is trust on first use; retain a reviewed copy for later upgrades.
          - Verify `SHA256SUMS.minisig` with a trusted release public key first, then run `sha256sum --ignore-missing -c SHA256SUMS`. See the README's **Verify a download** section.
          - `latest.json` and `latest.json.minisig` describe this release for future update clients; metadata has no expiry.

          Built natively on Ubuntu 24.04; requires glibc 2.39 or newer, graphics drivers, fontconfig, xkbcommon, and Wayland/X11 libraries. These are dynamically linked builds, not self-contained AppImages. See the bundled README for dependencies and installation.

          Requires an existing Rex server with API revision 10, 11, 12 or 13. Installing the client does not start, stop, or modify a Rex server.
          EOF
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Rex Rune ${GITHUB_REF_NAME#v}" --notes-file RELEASE-NOTES.md
          gh release upload "$GITHUB_REF_NAME" ./*.tar.gz ./*.deb ./*.pkg.tar.zst ./*.pkg.tar.zst.sig SHA256SUMS SHA256SUMS.minisig latest.json latest.json.minisig install.sh install.sh.minisig
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Rebuild signed repository from immutable releases
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: python3 scripts/build-repo-site.py --require-tag "$GITHUB_REF_NAME"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  pages:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pkg-pages-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
