name: CI

# Every pull request and every push to master, on the three platforms the client builds
# for. Linux is the released platform and runs everything. macOS builds the app and runs
# the tests. Windows builds the probes and app and runs the VT and platform tests.
# Native Windows UI and server attachment are not tested (docs/plans/cross-platform.md).
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native and desktop integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config desktop-file-utils libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Library and probes, without the UI
        run: cargo check --locked --no-default-features
      - name: Lint every target and feature
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit, headless UI and signed updater tests
        run: cargo test --locked --all-features
      - name: Vendored SDK tests
        run: cargo test --manifest-path vendor/rexrs/Cargo.toml --all-features

  macos:
    name: macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Library and probes, without the UI
        run: cargo check --locked --no-default-features
      - name: Lint every target and feature
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build the app
        run: cargo build --locked --bin rex-rune
      - name: The app starts
        run: |
          test "$(target/debug/rex-rune --version)" = "rex-rune $(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          target/debug/rex-rune --help > /dev/null
      - name: Unit and headless UI tests
        run: cargo test --locked --all-features

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # ghostty-vt-sys downloads the Ghostty source itself, but through the system TLS stack,
      # which rejects the host's certificate chain on this runner. Fetch the archive the
      # crate pins with curl, check it against the hash beside it, and hand the build script
      # the extracted tree. Both are read from the crate's own GHOSTTY.lock, so a bump of
      # ghostty-vt cannot leave this job building the old source.
      - name: Ghostty source
        shell: bash
        run: |
          lock="$(cargo metadata --locked --format-version 1 | python -c 'import json, pathlib, sys; packages = json.load(sys.stdin)["packages"]; crate = next(p for p in packages if p["name"] == "ghostty-vt-sys"); print(pathlib.Path(crate["manifest_path"]).with_name("GHOSTTY.lock").as_posix())')"
          url="$(sed -n 's/^url = //p' "$lock" | tr -d '\r')"
          sha256="$(sed -n 's/^sha256 = //p' "$lock" | tr -d '\r')"
          test -n "$url" && test -n "$sha256"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/ghostty.tar.gz" "$url"
          echo "$sha256  $RUNNER_TEMP/ghostty.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/ghostty"
          "$SYSTEMROOT/System32/tar.exe" -xzf "$(cygpath -w "$RUNNER_TEMP/ghostty.tar.gz")" -C "$(cygpath -w "$RUNNER_TEMP/ghostty")" --strip-components=1
          echo "GHOSTTY_SOURCE_DIR=$(cygpath -w "$RUNNER_TEMP/ghostty")" >> "$GITHUB_ENV"
      - name: Library and probes, without the UI
        run: cargo build --locked --no-default-features --bins
      - name: Link and run libghostty-vt
        run: cargo test --locked --no-default-features --test cursor_policy --test prompt_navigation
      - name: Keymap fixture
        run: cargo test --locked --no-default-features --test keymap_fixture
      # Everything in the library known to run here: Ghostty decoding, search and frames
      # (terminal::), the platform boundary, upload ids and the update lock. One invocation,
      # and a floor on how many ran, because a filter that matches nothing also passes.
      - name: Library tests that run on Windows
        shell: bash
        run: |
          cargo test --locked --no-default-features --lib -- terminal:: platform:: upload::tests:: update::tests::update_state_lock 2>&1 | tee "$RUNNER_TEMP/lib-tests.log"
          ran="$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' "$RUNNER_TEMP/lib-tests.log" | head -n 1)"
          echo "library tests run: ${ran:-0}"
          test "${ran:-0}" -ge 25
      - name: Lint every target and feature
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build the app
        run: cargo build --locked --bin rex-rune
      - name: The app starts
        shell: bash
        run: |
          test "$(target/debug/rex-rune.exe --version)" = "rex-rune $(python -c 'import sys,tomllib; sys.stdout.write(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          target/debug/rex-rune.exe --help > /dev/null
      - name: App platform boundary
        run: cargo test --locked --bin rex-rune app::platform::tests
      # The font stack, the bundled symbols font, and DirectWrite's list and lookup. A floor
      # on how many ran, as above.
      - name: Fonts through DirectWrite
        shell: bash
        run: |
          cargo test --locked --bin rex-rune -- app::fonts:: app::platform::fonts:: 2>&1 | tee "$RUNNER_TEMP/font-tests.log"
          ran="$(sed -n 's/^test result: ok\. \([0-9]*\) passed.*/\1/p' "$RUNNER_TEMP/font-tests.log" | head -n 1)"
          echo "font tests run: ${ran:-0}"
          test "${ran:-0}" -ge 12
