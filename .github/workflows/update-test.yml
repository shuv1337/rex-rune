name: Updater tests

on:
  pull_request:
    paths:
      - 'src/update.rs'
      - 'src/update/**'
      - 'src/app/updates.rs'
      - 'src/app/updates_tests.rs'
      - 'src/settings.rs'
      - 'src/main.rs'
      - 'src/app/mod.rs'
      - 'src/app/workspace.rs'
      - 'scripts/install-desktop.sh'
      - 'scripts/package-release.py'
      - 'packaging/install/**'
      - 'resources/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/update-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  updater:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Native and desktop integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config desktop-file-utils libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev libx11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev mesa-vulkan-drivers
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Formatting, lint and full tests (including signed updater fixture)
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-features
