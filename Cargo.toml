[package]
name = "rex-linux"
version = "0.7.3"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[features]
default = ["ui"]
ui = ["dep:arboard", "dep:rune", "dep:rune-kit", "dep:rune-theme-opencode", "dep:zbus", "dep:image"]

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"], optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
flume = "0.11"
tar = "0.4"
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
ghostty-vt = { version = "=0.8.0", features = ["png"] }
gethostname = "1"
# Embedded desktop notification icon; no installed icon theme is required.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
log = "0.4"
rexrs = { git = "https://github.com/a10y/rexrs", rev = "780be3f9f0455c758273e57199af30bdaa145cf1", default-features = false, features = ["tokio"] }
# Rune is pre-1.0 and pinned to a `dev` revision.
rune = { git = "https://github.com/anomalyco/rune.git", rev = "d70929a4dae263d16d2e8088e7bfe53f58f619ad", optional = true }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "d70929a4dae263d16d2e8088e7bfe53f58f619ad", optional = true }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "d70929a4dae263d16d2e8088e7bfe53f58f619ad", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TCP keepalive and user timeout, so a silently dropped connection fails and reconnects.
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
libc = "0.2"
ring = "0.17"
sha2 = "0.10"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
url = "2"
# Desktop notifications over D-Bus, with Rune's own zbus build.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"], optional = true }
unicode-segmentation = "1"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

[[bin]]
name = "rex-linux"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "rex-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "rex-workspace-probe"
path = "src/bin/workspace_probe.rs"

[[bin]]
name = "rex-download-probe"
path = "src/bin/download_probe.rs"

[[bin]]
name = "rex-update-probe"
path = "src/bin/update_probe.rs"

# Rune at the pinned revision with Rex's Linux window-chrome additions (vendor/rune/README.md).
[patch."https://github.com/anomalyco/rune.git"]
rune = { path = "vendor/rune/crates/rune" }
rune-motion = { path = "vendor/rune/crates/rune-motion" }
rune-staging = { path = "vendor/rune/crates/rune-staging" }

# Revision-13 generated types and explicit negotiation range (vendor/rexrs/REX-LINUX.md).
[patch."https://github.com/a10y/rexrs"]
rexrs = { path = "vendor/rexrs" }

# The pinned C image iterator exposed through a safe Rust render wrapper.
[patch.crates-io]
ghostty-vt = { path = "vendor/ghostty-vt" }

[[example]]
name = "chrome_spike"
required-features = ["ui"]
