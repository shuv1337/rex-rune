[package]
name = "rex-rune"
version = "0.13.1"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

[features]
default = ["ui"]
ui = [
    "dep:arboard",
    "dep:rune",
    "dep:rune-kit",
    "dep:rune-theme-opencode",
    "dep:zbus",
    "dep:image",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-user-notifications",
    "dep:block2",
]

# Desktop notifications over D-Bus on Linux and the BSDs. Keep our Tokio zbus 6
# separate from Rune's async-io zbus 5.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"], optional = true }

# Desktop notifications through the notification centre on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5.3", optional = true }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSObject", "NSString"], optional = true }
objc2-user-notifications = { version = "0.2.2", optional = true, features = [
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
block2 = { version = "0.5.1", optional = true }

[dependencies]
anyhow = "1"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"], optional = true }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
flume = "0.11"
tar = "0.4"
tempfile = "3"
futures-util = { version = "0.3", features = ["sink"] }
ghostty-vt = { version = "=0.8.0", features = ["png"] }
gethostname = "1"
icu_properties = "2"
# Embedded desktop notification icon; no installed icon theme is required.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
log = "0.4"
rexrs = { git = "https://github.com/a10y/rexrs", rev = "780be3f9f0455c758273e57199af30bdaa145cf1", default-features = false, features = ["tokio"] }
# Rune is pre-1.0 and pinned to a `dev` revision.
# No Hunspell or Rune default fonts. Rex supplies its own fonts, so rune-text
# does not need sibling assets that are absent from Nix's flat Cargo vendor tree.
rune = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322", default-features = false, features = ["accessibility", "dbus", "metal-backend", "ogg-audio", "svg", "tooling"], optional = true }
rune-kit = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322", optional = true }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# TCP keepalive and user timeout, so a silently dropped connection fails and reconnects.
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
libc = "0.2"
ring = "0.17"
sha2 = "0.10"
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }
url = "2"
unicode-segmentation = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false
opt-level = 2

[[bin]]
name = "rex-rune"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "rex-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "rex-workspace-probe"
path = "src/bin/workspace_probe.rs"

[[bin]]
name = "rex-download-probe"
path = "src/bin/download_probe.rs"

[[bin]]
name = "rex-install-probe"
path = "src/bin/install_probe.rs"

[[bin]]
name = "rex-update-probe"
path = "src/bin/update_probe.rs"

# Local Linux window and GSettings fixes (vendor/rune/README.md).
[patch."https://github.com/anomalyco/rune.git"]
rune = { path = "vendor/rune/crates/rune" }

# Revision-21 generated types and explicit negotiation range (vendor/rexrs/REX-RUNE.md).
[patch."https://github.com/a10y/rexrs"]
rexrs = { path = "vendor/rexrs" }

[patch.crates-io]
# Rune's upstream workspace patches must also apply in its consumers.
winit = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322" }
parley_engine = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322" }
wgpu-hal = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322" }
naga = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322" }
accesskit_windows = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322" }
accesskit_macos = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune.git", rev = "f1b079ccad541008073e73d0987b876f4c99c322" }
# The pinned C image iterator exposed through a safe Rust render wrapper.
ghostty-vt = { path = "vendor/ghostty-vt" }

[[example]]
name = "chrome_spike"
required-features = ["ui"]
