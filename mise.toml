[tools]
rust = { version = "1.96.1", components = "clippy,rustfmt" }
zig = "0.17.1"

[tasks.build]
description = "Build the release application"
run = "cargo build --locked --release --bin rex-rune && touch target/release/.rex-rune-build.stamp"
sources = [
    "Cargo.toml",
    "Cargo.lock",
    "src/**/*",
    "resources/icons/256x256/apps/dev.shuv.rex-rune.png",
    "vendor/rune/crates/{rune,rune-motion,rune-staging,rune-taffy,procwatch}/Cargo.toml",
    "vendor/rune/crates/{rune,rune-motion,rune-staging,rune-taffy,procwatch}/src/**/*",
    "vendor/rune/crates/rune/assets/**/*",
    "vendor/rexrs/Cargo.toml",
    "vendor/rexrs/src/**/*",
    "vendor/ghostty-vt/**/*",
]
outputs = ["target/release/rex-rune", "target/release/.rex-rune-build.stamp"]

[tasks.install]
description = "Build Rex Rune and install it with a launcher for the current user"
depends = ["build"]
run = "bash scripts/install-desktop.sh --copy"

[tasks.uninstall]
description = "Remove the current user's Rex Rune installation"
run = "bash scripts/install-desktop.sh --uninstall"

[tasks.test]
description = "Run unit and headless UI tests"
run = "cargo test --locked --all-features"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Lint every target and feature"
run = "cargo clippy --locked --all-targets --all-features -- -D warnings"

[tasks."test-rexrs"]
description = "Test the vendored Rex SDK"
run = "cargo test --manifest-path vendor/rexrs/Cargo.toml --all-features"

[tasks.check]
description = "Run all repository checks"
run = """
cargo fmt --all -- --check
cargo clippy --locked --all-targets --all-features -- -D warnings
cargo test --locked --all-features
cargo test --manifest-path vendor/rexrs/Cargo.toml --all-features
"""
